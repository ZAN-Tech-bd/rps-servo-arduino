<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Rock-Paper-Scissors Servo Bot — Circuit Diagram</text>

  <!-- Arduino Uno -->
  <rect x="330" y="220" width="240" height="220" rx="10" fill="#0f8a5f" stroke="#0a5c3f" stroke-width="2"/>
  <text x="450" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Arduino Uno</text>
  <rect x="345" y="270" width="60" height="30" fill="#ffffff" stroke="#0a5c3f"/>
  <text x="375" y="290" text-anchor="middle" font-size="12" fill="#0a5c3f">USB</text>

  <!-- Uno pin labels (right side: digital pins) -->
  <line x1="570" y1="290" x2="620" y2="290" stroke="#333" stroke-width="2"/>
  <circle cx="570" cy="290" r="4" fill="#333"/>
  <text x="630" y="295" font-size="14" fill="#1a1a1a">Pin 9  → Servo Signal</text>

  <line x1="570" y1="330" x2="620" y2="330" stroke="#333" stroke-width="2"/>
  <circle cx="570" cy="330" r="4" fill="#333"/>
  <text x="630" y="335" font-size="14" fill="#1a1a1a">Pin 7  → Ultrasonic TRIG</text>

  <line x1="570" y1="370" x2="620" y2="370" stroke="#333" stroke-width="2"/>
  <circle cx="570" cy="370" r="4" fill="#333"/>
  <text x="630" y="375" font-size="14" fill="#1a1a1a">Pin 8  → Ultrasonic ECHO</text>

  <!-- Uno pin labels (left side: power) -->
  <line x1="330" y1="290" x2="280" y2="290" stroke="#c0392b" stroke-width="2"/>
  <circle cx="330" cy="290" r="4" fill="#c0392b"/>
  <text x="270" y="295" text-anchor="end" font-size="14" fill="#c0392b">5V</text>

  <line x1="330" y1="330" x2="280" y2="330" stroke="#333" stroke-width="2"/>
  <circle cx="330" cy="330" r="4" fill="#333"/>
  <text x="270" y="335" text-anchor="end" font-size="14" fill="#1a1a1a">GND</text>

  <!-- Power rail (left vertical bus) -->
  <line x1="280" y1="150" x2="280" y2="480" stroke="#c0392b" stroke-width="3"/>
  <text x="280" y="140" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">+5V RAIL</text>

  <line x1="230" y1="150" x2="230" y2="480" stroke="#333" stroke-width="3"/>
  <text x="230" y="140" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">GND RAIL</text>

  <line x1="230" y1="290" x2="280" y2="290" stroke="#c0392b" stroke-width="0" opacity="0"/>

  <!-- connect rails to Uno pins -->
  <line x1="280" y1="290" x2="280" y2="290" stroke="#c0392b" stroke-width="2"/>
  <line x1="230" y1="330" x2="230" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="290" x2="280" y2="290" stroke="#c0392b"/>
  <line x1="230" y1="330" x2="330" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="290" x2="330" y2="290" stroke="#c0392b" stroke-width="2"/>

  <!-- Servo -->
  <rect x="60" y="150" width="150" height="100" rx="8" fill="#2c6fbb" stroke="#1a4d85" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Servo Motor</text>
  <text x="135" y="205" text-anchor="middle" font-size="12" fill="#e8f0fb">(SG90 / MG90S)</text>

  <!-- servo wires -->
  <line x1="210" y1="170" x2="280" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="170" x2="280" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="215" y="165" font-size="11" fill="#c0392b">VCC (red)</text>

  <line x1="210" y1="190" x2="230" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="190" x2="230" y2="150" stroke="#333" stroke-width="2"/>
  <text x="215" y="205" font-size="11" fill="#1a1a1a">GND (brown)</text>

  <line x1="210" y1="210" x2="620" y2="210" stroke="#e0a800" stroke-width="2"/>
  <line x1="620" y1="210" x2="620" y2="290" stroke="#e0a800" stroke-width="2"/>
  <line x1="570" y1="290" x2="620" y2="290" stroke="#e0a800" stroke-width="0"/>
  <text x="215" y="225" font-size="11" fill="#a8790a">Signal (orange) → D9</text>

  <!-- Ultrasonic Sensor HC-SR04 -->
  <rect x="60" y="380" width="150" height="110" rx="8" fill="#8e44ad" stroke="#5f2e75" stroke-width="2"/>
  <text x="135" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">HC-SR04</text>
  <text x="135" y="428" text-anchor="middle" font-size="12" fill="#f1e8f7">Ultrasonic Sensor</text>
  <circle cx="105" cy="455" r="14" fill="#ffffff" stroke="#5f2e75"/>
  <circle cx="165" cy="455" r="14" fill="#ffffff" stroke="#5f2e75"/>
  <text x="105" y="459" text-anchor="middle" font-size="9" fill="#5f2e75">TX</text>
  <text x="165" y="459" text-anchor="middle" font-size="9" fill="#5f2e75">RX</text>

  <!-- ultrasonic wires -->
  <line x1="210" y1="400" x2="280" y2="400" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="400" x2="280" y2="480" stroke="#c0392b" stroke-width="2"/>
  <text x="215" y="395" font-size="11" fill="#c0392b">VCC (5V)</text>

  <line x1="210" y1="420" x2="230" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="420" x2="230" y2="480" stroke="#333" stroke-width="2"/>
  <text x="215" y="435" font-size="11" fill="#1a1a1a">GND</text>

  <line x1="210" y1="440" x2="640" y2="440" stroke="#27ae60" stroke-width="2"/>
  <line x1="640" y1="440" x2="640" y2="330" stroke="#27ae60" stroke-width="2"/>
  <line x1="620" y1="330" x2="640" y2="330" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="455" font-size="11" fill="#1e8449">TRIG → D7</text>

  <line x1="210" y1="460" x2="660" y2="460" stroke="#2980b9" stroke-width="2"/>
  <line x1="660" y1="460" x2="660" y2="370" stroke="#2980b9" stroke-width="2"/>
  <line x1="570" y1="370" x2="660" y2="370" stroke="#2980b9" stroke-width="2"/>
  <text x="215" y="475" font-size="11" fill="#1f618d">ECHO → D8</text>

  <!-- Legend -->
  <rect x="640" y="480" width="230" height="120" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="655" y="502" font-size="13" font-weight="bold" fill="#1a1a1a">Legend</text>
  <line x1="655" y1="515" x2="685" y2="515" stroke="#c0392b" stroke-width="3"/>
  <text x="692" y="519" font-size="12" fill="#1a1a1a">5V / Power</text>
  <line x1="655" y1="535" x2="685" y2="535" stroke="#333" stroke-width="3"/>
  <text x="692" y="539" font-size="12" fill="#1a1a1a">GND</text>
  <line x1="655" y1="555" x2="685" y2="555" stroke="#e0a800" stroke-width="3"/>
  <text x="692" y="559" font-size="12" fill="#1a1a1a">Servo signal (D9)</text>
  <line x1="655" y1="575" x2="685" y2="575" stroke="#27ae60" stroke-width="3"/>
  <text x="692" y="579" font-size="12" fill="#1a1a1a">TRIG (D7)</text>
  <line x1="655" y1="590" x2="685" y2="590" stroke="#2980b9" stroke-width="3"/>
  <text x="692" y="594" font-size="12" fill="#1a1a1a">ECHO (D8)</text>

  <!-- Note -->
  <text x="450" y="565" text-anchor="middle" font-size="12" fill="#555">Note: If using a high-torque servo, power it from an external 5V supply and share GND with the Arduino.</text>
</svg>
